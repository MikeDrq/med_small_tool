# End-to-end paper-reproduction inference profile.
pipeline:
  device: cuda
  amp: true
  input_size: 512
  num_slices: 32
  patch_size: 4
  slice_selection:
    mode: uniform
  roi_crop_size: 224
  roi_fill_strategy: nearest
  module1_score_mode: objectness_quality
  # Keep end-to-end ROI extraction identical to Module 1 validation.
  module1_nms_threshold: 0.3
  module1_topk_per_image: null
  module1_quality_score_alpha: 1.0
  module1_quality_score_beta: 1.0
  module1_config: configs/module1_meniscovit_cop.yaml
  module2_config: configs/module2_swin.yaml
  module3_config: configs/module3_bucket_swin.yaml
  module1_checkpoint: checkpoints/paper_reproduction/module1/best.pt
  module2_checkpoint: checkpoints/paper_reproduction/module2/best.pt
  module3_checkpoint: checkpoints/paper_reproduction/module3_f1/best.pt
  module3_use_checkpoint_threshold: true
  # Optional explicit override. When null, Module 4 runs the coronal U2Net below.
  tibia_width: null

thresholds:
  # Published pipeline cutoffs; the Module 1 validation sweep independently
  # confirms location=.2 as the max-F1 operating point at IoU>0.45.
  detection_score: 0.2
  side_score: 0.5
  abnormal_score: 0.4
  # Fallback for legacy checkpoints; new Module3 checkpoints override this
  # with the F1-optimal validation threshold stored in their metadata.
  bucket_handle_score: 0.5
  discoid_beta: 0.4

module4:
  # Paper definition: beta = lateral meniscus width / tibia width; beta > .4.
  # Figure 11 measures w1 and w2 on the same coronal slice.
  measurement_mode: paired_same_slice_near_max_plateau
  threshold: 0.4
  probability_temperature: 0.05
  tibia_width_priority: [annotation, mask, unet]
  # End-to-end evaluation must never fall back to a ground-truth box.
  meniscus_width_priority: [roi_cache]
  roi_cache_dir: null
  image_width: 512
  min_tibia_slice_pixels: 256
  # Keep near-central slices with an almost fully visible tibial plateau.
  min_plateau_width_fraction: 0.95
  # Paper-inferred case-level aggregation; keep max_w2 until validation sweep.
  beta_aggregation: max_w2
  min_candidate_slices: 1
  central_window_radius: 1
  tibia_segmenter:
    enabled: true
    model_definition: ../seg/src/model.py
    factory: u2net_full
    checkpoint: ../seg/save_weights/model_cor_multiclass_2024424_best.pth
    num_classes: 3
    tibia_class: 2
    input_size: 320
    batch_size: 4
    amp: true
  bootstrap_samples: 1000

outputs:
  save_rois: true
  save_visualizations: true
  output_dir: outputs/paper_reproduction
